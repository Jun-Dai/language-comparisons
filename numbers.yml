# Numbers 1-10 in Various Languages
# Extracted from Wikipedia User:Jun-Dai/Linguistics/Numbers_1–10

metadata:
  title: "Numbers 1-10 in Various Languages"
  description: |
    Hypothesis: it is fairly easy to tell how closely or distantly related, or unrelated,
    two languages are by comparing how they say the numbers from one to nine.
    Also: the family tree for the term 'zero' will look quite different from the family trees of languages overall.
  notes: |
    A lot of people are surprised to find that Northern Indian languages and Southern Indian languages come from
    entirely different language families, and that Hindi, Persian, and English are related, whereas Tamil, Arabic,
    and Turkish are unrelated to them as well as to each other. Similarly, that Japanese, Korean, and Chinese are
    (as far as anyone knows) unrelated languages.

languages:
  hindi:
    name: "Hindi"
    family: "Indo-European"
    subfamily: "Indo-Iranian"
    notes: |
      Hindi and Urdu are considered by linguists to be registers of the same Hindustani language.
      Note that what we call "Arabic numerals" in English are actually closer to the Hindi numerals here
      than they are to the ones used in "Arabic". All three systems are related.
    number_systems:
      default:
        numbers:
          "0":
            primary: "sunya"
            scripts:
              devanagari_text: "शून्य"
              devanagari_numeral: "०"
          "1":
            primary: "ek"
            scripts:
              devanagari_text: "एक"
              devanagari_numeral: "१"
          "2":
            primary: "do"
            scripts:
              devanagari_text: "दो"
              devanagari_numeral: "२"
          "3":
            primary: "tin"
            scripts:
              devanagari_text: "तीन"
              devanagari_numeral: "३"
          "4":
            primary: "char"
            scripts:
              devanagari_text: "चार"
              devanagari_numeral: "४"
          "5":
            primary: "panch"
            scripts:
              devanagari_text: "पांच"
              devanagari_numeral: "५"
          "6":
            primary: "chah"
            scripts:
              devanagari_text: "छह"
              devanagari_numeral: "६"
          "7":
            primary: "sat"
            scripts:
              devanagari_text: "सात"
              devanagari_numeral: "७"
          "8":
