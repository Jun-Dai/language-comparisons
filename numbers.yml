  farsi:
    name: "Farsi"
    alternate_names: ["Persian"]
    family: "Indo-European"
    subfamily: "Indo-Iranian"
    notes: |
      AKA, Persian. Despite using a variant of the Arabic script, Persian and Arabic are considered
      unrelated languages — they have borrowed lots of words from each other, but they come from very
      different origins, which you can see here with these numbers, which were one of the inspirations
      for this page, along with Maltese. You can see that Farsi numbers are very closely related to
      numbers in Hindi/Urdu. But the written numerals are basically the same as in Urdu and Arabic
      and very different from Hindi.
    number_systems:
      default:
        numbers:
          "0":
            primary: "sefr"
            scripts:
              arabic_text: "صفر"
              arabic_numeral: "۰"
          "1":
            primary: "yek"
            scripts:
              arabic_text: "یک"
              arabic_numeral: "۱"
          "2":
