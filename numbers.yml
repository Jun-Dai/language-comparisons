  brahui:
    name: "Brahui"
    family: "Dravidian"
    subfamily: ""
    notes: |
      Brahui is a Dravidian language that is spoken in some parts of Pakistan and written with Arabic script.
      Apparently only some 15% of the vocabulary is of Dravidian origin. This was one of the inspirations for
      creating this whole page, and this is the first real challenge to my hypothesis, since only the first three
      numbers are related to Tamil — the remaining numbers were borrowed from Baloch, and you can clearly see that
      they are Indo-European and related to Urdu/Hindi.
      As an endangered minority language, Brahui is not so well-documented on the Internet. I did not find the
      numbers written with Arabic script (though I can guess what they would look like). Apparently Brahui was never
      written with a Brahmi script — it was purely a spoken language for most of its history, and an Arabic-based
      script was created at some point to document the folklore, and more recently it has been given an orthography
      using Latin letters with diacritics, which you see here.
      Despite being an endangered minority language, the 2017 census lists the language as having 2.5 million speakers.
    number_systems:
      default:
        numbers:
          "1":
            primary: "asi"
          "2":
            primary: "irā"
          "3":
            primary: "musi"
          "4":
            primary: "čār"
          "5":
            primary: "panč"
          "6":
            primary: "šaš"
          "7":
            primary: "haft"
          "8":
            primary: "haš"
          "9":
            primary: "nō"
          "10":
            primary: "dah"
    references: []

  hungarian:
    name: "Hungarian"
    family: "Uralic"
    subfamily: ""
    notes: |
      Despite being in the middle of Europe and surrounded by a wide variety of Indo-European languages,
      Hungarian is actually related to Estonian, Finnish, Sami, etc. It's a little hard to see the relationship
      (you really have to squint, as Hungarian has been isolated for a long time), but one thing is super clear:
      it is totally different from its neighbours: Slovakia, Poland, Romania, Serbia, Croatia, Slovenia, and Austria.
    number_systems:
      default:
        numbers:
          "0":
            primary: "nulla"
          "1":
            primary: "egy"
          "2":
            primary: "kettő"
          "3":
            primary: "három"
          "4":
            primary: "négy"
          "5":
            primary: "öt"
          "6":
            primary: "hat"
          "7":
            primary: "hét"
          "8":
            primary: "nyolc"
          "9":
            primary: "kilenc"
          "10":
            primary: "tíz"
    references: []

  estonian:
    name: "Estonian"
    family: "Uralic"
    subfamily: ""
    notes: |
      Despite being surrounded by Baltic and Slavic languages, Estonian is related to Hungarian and Finnish,
      which are not part of the Indo-European language family at all (whereas Lithuanian and Latvian are Balto-Slavic,
      a fairly distinct branch of Indo-European that they shared with the now-extinct East Prussian). Estonian seems
      pretty distant from Hungarian, though — you really have to squint to see it here, but you can tell it's not
      related to any of the Indo-European languages on this page.
    number_systems:
      default:
        numbers:
          "0":
            primary: "null"
          "1":
            primary: "üks"
          "2":
            primary: "kaks"
          "3":
            primary: "kolm"
          "4":
            primary: "neli"
          "5":
            primary: "viis"
