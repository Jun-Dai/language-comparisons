    notes: |
      Worth breaking Greek out into modern and ancient, given how influential ancient Greek was on other languages.
      The first few Ancient Greek numbers are gendered and they decline, so there can be around a dozen forms for
      each number. I've picked the nominative neuter version for each number, though I dunno if that's the most
      appropriate one.
