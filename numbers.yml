              arabic_numeral: "۲"
          "3":
            primary: "se"
            scripts:
              arabic_text: "سه"
              arabic_numeral: "۳"
          "4":
            primary: "chahâr"
            scripts:
              arabic_text: "چهار"
              arabic_numeral: "۴"
          "5":
            primary: "panj"
            scripts:
              arabic_text: "پنج"
              arabic_numeral: "۵"
          "6":
            primary: "shesh"
            scripts:
              arabic_text: "شش"
              arabic_numeral: "۶"
          "7":
            primary: "haft"
            scripts:
              arabic_text: "هفت"
              arabic_numeral: "۷"
          "8":
            primary: "hasht"
            scripts:
              arabic_text: "هشت"
              arabic_numeral: "۸"
          "9":
            primary: "noh"
            scripts:
              arabic_text: "نه"
              arabic_numeral: "۹"
          "10":
            primary: "dah"
            scripts:
              arabic_text: "ده"
              arabic_numeral: "۱۰"
    references: []

  pashto:
    name: "Pashto"
    family: "Indo-European"
    subfamily: "Indo-Iranian"
