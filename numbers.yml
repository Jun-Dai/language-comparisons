  albanian:
    name: "Albanian"
    family: "Indo-European"
    subfamily: "Albanian"
    notes: |
      Despite being surrounded by Romance, Slavic, and Hellenic languages, and being taken in by the Greek,
      Roman, Ottoman, and other empires for much of its history, Albanian continues to exist as its own branch
      of the Indo-European language family. In theory it is less closely related to Italian, English and Russian
      than those languages are to Hindi. It is closer to Greek than the others.
      The numbers below definitely suggest a closer relationship to Italian than to, say, English or Hindi,
      but it's still pretty far out there.
    number_systems:
      default:
        numbers:
          "0":
            primary: "zero"
          "1":
            primary: "një"
          "2":
            primary: "dy"
          "3":
            primary: "tre"
          "4":
            primary: "katër"
          "5":
            primary: "pesë"
          "6":
            primary: "gjashtë"
          "7":
            primary: "shtatë"
          "8":
            primary: "tetë"
          "9":
            primary: "nëntë"
          "10":
            primary: "dhjetë"
    references: []

