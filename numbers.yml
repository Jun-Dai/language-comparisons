              devanagari_numeral: "१०"
    references: []

  urdu:
    name: "Urdu"
    family: "Indo-European"
    subfamily: "Indo-Iranian"
    notes: |
      Urdu and Hindi are considered by linguists to be registers of the same Hindustani language,
      even though Hindi is written using Devanagari and Urdu is written using an Arabic script.
      Also, despite all the words borrowed from Arabic through Persian, the Hindustani language
      comes from Vedic Sanskrit.
