  maltese:
    name: "Maltese"
    native_name: "Malti"
    family: "Semitic"
    subfamily: ""
    notes: |
      Even though the majority of the vocabulary in Maltese is from Italian and the people of Malta are predominantly
      Catholic, Maltese is considered an Arabic language, being the only surviving member of the Siculo-Arabic languages.
      It's the only variety of Arabic that is normally written with the Latin alphabet. The relationship to Arabic could
      hardly be clearer, and this was an inspiration for this page.
