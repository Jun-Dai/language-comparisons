  kabardian:
    name: "Kabardian"
    native_name: "Адыгэбзэ"
    alternate_names: ["East Circassian", "Kabardino-Circassian"]
    family: "Northwest Caucasian"
    subfamily: ""
    notes: |
      Kabardian is a Northwest Caucasian language spoken mainly in the Kabardino-Balkar and
      Karachay-Circassian Republics of Russia. It is closely related to Adyghe, and together they
      form the Circassian language group. Kabardian has been written with the Cyrillic alphabet
      since 1936, and the Kabardian Cyrillic alphabet contains 59 letters.
