  brahui:
    name: "Brahui"
    native_name: "براہوی"
    family: "Dravidian"
    subfamily: ""
    notes: |
      Brahui is a Dravidian language that is spoken in some parts of Pakistan and written with Arabic script.
      Apparently only some 15% of the vocabulary is of Dravidian origin. This was one of the inspirations for
      creating this whole page, and this is the first real challenge to my hypothesis, since only the first three
      numbers are related to Tamil — the remaining numbers were borrowed from Baloch, and you can clearly see that
      they are Indo-European and related to Urdu/Hindi.
      As an endangered minority language, Brahui is not so well-documented on the Internet. I did not find the
      numbers written with Arabic script (though I can guess what they would look like). Apparently Brahui was never
      written with a Brahmi script — it was purely a spoken language for most of its history, and an Arabic-based
      script was created at some point to document the folklore, and more recently it has been given an orthography
      using Latin letters with diacritics, which you see here.
      Despite being an endangered minority language, the 2017 census lists the language as having 2.5 million speakers.
    number_systems:
      default:
        numbers:
          "1":
            primary: "asi"
          "2":
            primary: "irā"
          "3":
            primary: "musi"
          "4":
            primary: "čār"
          "5":
            primary: "panč"
